services:
  api:
    container_name: plasain-api
    image: ghcr.io/spikevn/plasain-api:latest
    pull_policy: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DISH_UPLOADS_PATH: /data/uploads/dishes
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      SQLITE_DB_PATH: /data/plasain.db
    volumes:
      - backend-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  backend-data:
